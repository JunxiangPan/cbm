[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbm-attach"
version = "0.1.0"
description = "CBM sidecar attachment evidence for the v1.7 release train"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
markers = [
    "known_fail_silent: documents a known upstream fail-silent defect; green while the defect exists",
]
