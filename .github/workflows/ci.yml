name: cbm-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cbm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10"]
    env:
      PYTHONIOENCODING: utf-8
      CBS_REPO: ${{ github.workspace }}/cbs
    steps:
      - name: Checkout CBM
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # The B5 canary loads the real CBS body generator. Pin a known-good
      # public commit; do not use contract/v1.7.1 (it is an unfrozen RC).
      - name: Checkout pinned CBS for the B5 canary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: JunxiangPan/Cyber-Butler-Security
          ref: fa1740fe03590ec9adfc9ab57cf1485bdc3bea87
          path: cbs
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema pyyaml

      - name: Run tests
        run: python -m pytest
